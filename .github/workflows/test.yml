name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Official Foundry >= 1.8 ships native Monad execution (network = "monad" in foundry.toml)
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Check Foundry version
        run: ./scripts/check-foundry.sh

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

